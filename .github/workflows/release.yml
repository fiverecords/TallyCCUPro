name: Release

# Push a tag such as v3.8 (with docs/release-notes/v3.8.md committed) to build and publish
# TallyCCUPro-<tag>.zip and TallyCCU_Configurator.exe as a GitHub release. The full CI runs first.
# Alternatively run it by hand (Actions > Release > Run workflow) on main with the tag name:
# the release step then creates the tag on that commit.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create on this commit and publish (e.g. v3.8)'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    name: Firmware, pages and tools zip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tag and release notes
        run: |
          [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run the release by hand only on main"; exit 1
          fi
          f="docs/release-notes/${TAG}.md"
          test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
      - name: Compressed pages
        run: |
          python3 tools/gzip_sdcard.py --force
          python3 tools/gzip_sdcard.py --check
      - name: Build the zip
        run: |
          name="TallyCCUPro-${TAG}"
          root="dist/$name"
          mkdir -p "$root/firmware" "$root/sdcard" "$root/tools"
          cp -r firmware/TallyCCUPro "$root/firmware/"
          cp sdcard/*.html sdcard/*.gz "$root/sdcard/"
          cp tools/*.py tools/requirements.txt "$root/tools/"
          cp README.md LICENSE "$root/"
          # stable order and timestamps: the zip only changes when its files do
          find "$root" -exec touch -d "@$(git log -1 --format=%ct)" {} +
          (cd dist && find "$name" -type f | LC_ALL=C sort | zip -X -q "$name.zip" -@)
          unzip -l "dist/$name.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: package
          path: dist/TallyCCUPro-*.zip
          if-no-files-found: error

  exe:
    name: TallyCCU_Configurator.exe (PyInstaller)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install -r tools/requirements-build.txt
      - name: Build from tools/TallyCCU_Configurator.spec
        env:
          PYTHONHASHSEED: '0'
        run: python -m PyInstaller --clean --noconfirm tools/TallyCCU_Configurator.spec
      - name: Check the executable
        shell: bash
        run: |
          f=dist/TallyCCU_Configurator.exe
          test -f "$f" && [ "$(stat -c %s "$f")" -gt 1000000 ]
          sha256sum "$f"
      - uses: actions/upload-artifact@v5
        with:
          name: exe
          path: dist/TallyCCU_Configurator.exe
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [ci, package, exe]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # only the two release files, not the CI reports of this run
      - uses: actions/download-artifact@v5
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@v5
        with:
          name: exe
          path: dist
      - name: Checksums
        run: |
          cd dist
          sha256sum "TallyCCUPro-${TAG}.zip" TallyCCU_Configurator.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # manual run: the tag must not exist yet; gh creates it on this commit
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::tag $TAG already exists"; exit 1
            fi
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$TAG" "${flags[@]}" \
            --title "TallyCCU Pro ${TAG}" \
            --notes-file "docs/release-notes/${TAG}.md" \
            "dist/TallyCCUPro-${TAG}.zip" \
            dist/TallyCCU_Configurator.exe \
            dist/SHA256SUMS.txt
