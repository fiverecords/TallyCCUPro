<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SD Card - TallyCCU Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
:root {
  --bg-primary: #1a1a1c;
  --bg-secondary: #232326;
  --bg-tertiary: #2a2a2e;
  --bg-panel: #1e1e21;
  --bg-input: #333338;
  --bg-hover: #35353a;
  
  --border-color: #3a3a40;
  --border-light: #454550;
  --border-focus: #5a8fd9;
  
  --text-primary: #e8e8e8;
  --text-secondary: #a0a0a5;
  --text-muted: #6a6a70;
  --text-label: #c8c8cc;
  
  --accent-blue: #4a90d9;
  --accent-blue-hover: #5a9fe8;
  --accent-orange: #e87a35;
  --accent-green: #4caf50;
  --accent-red: #e53935;
  
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 12px;
  --spacing-lg: 16px;
  --spacing-xl: 20px;
  
  --radius-sm: 3px;
  --radius-md: 4px;
  --radius-lg: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 13px;
  line-height: 1.4;
  min-height: 100vh;
}

/* === HEADER === */
.header {
  background: linear-gradient(180deg, #2d2d32 0%, var(--bg-secondary) 100%);
  border-bottom: 1px solid var(--border-color);
  padding: var(--spacing-md) var(--spacing-xl);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--spacing-lg);
}

.logo {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.logo-accent { color: var(--accent-orange); }

.logo-sub {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  margin-left: var(--spacing-md);
  padding-left: var(--spacing-md);
  border-left: 1px solid var(--border-color);
}

/* === BUTTONS === */
.btn {
  padding: var(--spacing-sm) var(--spacing-lg);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
  border-color: var(--border-light);
}

.btn-small {
  padding: var(--spacing-xs) var(--spacing-sm);
  font-size: 11px;
}

.btn-danger {
  background: #4a2525;
  border-color: #6a3535;
  color: #f88;
}

.btn-danger:hover {
  background: #6a3535;
}

.btn-danger:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn-rename {
  background: #2a3a4a;
  border-color: #3a5a6a;
  color: #8cf;
}

.btn-rename:hover {
  background: #3a5a6a;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* === MAIN CONTENT === */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: var(--spacing-xl);
}

/* === CONTROL PANEL === */
.control-panel {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  margin-bottom: var(--spacing-lg);
  overflow: hidden;
}

.control-panel-header {
  background: var(--bg-tertiary);
  padding: var(--spacing-md) var(--spacing-lg);
  border-bottom: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.control-panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.control-panel-body {
  padding: var(--spacing-lg);
}

/* === UPLOAD AREA === */
.upload-area {
  border: 2px dashed var(--border-color);
  border-radius: var(--radius-lg);
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  background: var(--bg-panel);
}

.upload-area:hover, .upload-area.dragover {
  border-color: var(--accent-blue);
  background: #1a2535;
}

.upload-area.uploading {
  cursor: default;
  border-color: var(--accent-blue);
  background: #1a2535;
}

.upload-area input[type="file"] { display: none; }

.upload-icon { 
  font-size: 48px; 
  margin-bottom: var(--spacing-md);
  opacity: 0.7;
}

.upload-text {
  color: var(--text-secondary);
  font-size: 14px;
}

/* === PROGRESS === */
.progress-container {
  display: none;
  margin-top: var(--spacing-lg);
  padding: var(--spacing-lg);
  background: var(--bg-panel);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.progress-container.show { display: block; }

.progress-filename {
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent-blue);
  margin-bottom: var(--spacing-sm);
  word-break: break-all;
  font-size: 13px;
}

.progress-bar-wrapper {
  background: var(--bg-input);
  border-radius: 10px;
  height: 20px;
  overflow: hidden;
  position: relative;
}

.progress-bar {
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-blue-hover));
  height: 100%;
  width: 0%;
  border-radius: 10px;
  transition: width 0.2s ease;
}

.progress-bar.indeterminate {
  width: 30%;
  animation: indeterminate 1.5s infinite ease-in-out;
}

@keyframes indeterminate {
  0% { margin-left: 0%; }
  50% { margin-left: 70%; }
  100% { margin-left: 0%; }
}

.progress-bar.complete {
  background: linear-gradient(90deg, #2d5a3d, var(--accent-green));
}

.progress-bar.error {
  background: linear-gradient(90deg, #4a2525, var(--accent-red));
}

.progress-info {
  display: flex;
  justify-content: space-between;
  margin-top: var(--spacing-sm);
  font-size: 12px;
  color: var(--text-secondary);
}

.progress-percent {
  font-weight: 600;
  color: var(--text-primary);
}

.progress-status {
  margin-top: var(--spacing-sm);
  font-size: 12px;
  color: var(--text-secondary);
}

.progress-status.success { color: var(--accent-green); }
.progress-status.error { color: var(--accent-red); }

/* === SPINNER === */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  vertical-align: middle;
  margin-right: var(--spacing-sm);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* === SELECTION TOOLBAR === */
.selection-toolbar {
  display: none;
  align-items: center;
  gap: var(--spacing-md);
  padding: var(--spacing-md) var(--spacing-lg);
  background: #2a3545;
  border: 1px solid #3a5a6a;
  border-radius: var(--radius-md);
  margin-bottom: var(--spacing-md);
}

.selection-toolbar.show {
  display: flex;
}

.selection-count {
  color: var(--accent-blue);
  font-weight: 600;
  font-size: 13px;
}

.selection-toolbar .btn {
  margin-left: auto;
}

/* === TABLE === */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: var(--spacing-md) var(--spacing-sm);
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}

th {
  color: var(--text-primary);
  font-weight: 600;
  background: var(--bg-tertiary);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tr:hover { 
  background: var(--bg-hover);
}

tr.selected {
  background: #1a2535;
}

tr.selected:hover {
  background: #1f2a3a;
}

.col-checkbox {
  width: 40px;
  text-align: center;
}

.file-name {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-primary);
  font-size: 13px;
}

.file-lock {
  color: var(--text-muted);
  font-size: 10px;
}

.file-size {
  color: var(--text-secondary);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
}

.actions { 
  display: flex; 
  gap: 6px; 
  flex-wrap: wrap; 
}

/* === CHECKBOX === */
input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--accent-blue);
  cursor: pointer;
}

/* === STATUS === */
.status {
  padding: var(--spacing-md) var(--spacing-lg);
  border-radius: var(--radius-md);
  margin-bottom: var(--spacing-lg);
  display: none;
  font-size: 13px;
}

.status.success {
  background: #1a3a2a;
  border: 1px solid #2d5a3d;
  color: var(--accent-green);
  display: block;
}

.status.error {
  background: #3a1a1a;
  border: 1px solid #5a2525;
  color: var(--accent-red);
  display: block;
}

/* === LOADING === */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-secondary);
}

.total-info {
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: var(--spacing-md);
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
}

/* === MODAL === */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}

.modal.show { display: flex; }

.modal-content {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: var(--spacing-xl);
  min-width: 320px;
  max-width: 90%;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.modal-content h3 {
  margin-bottom: var(--spacing-lg);
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 600;
}

.modal-content input {
  width: 100%;
  padding: var(--spacing-md);
  margin-bottom: var(--spacing-lg);
  background: var(--bg-input);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

.modal-content input:focus {
  outline: none;
  border-color: var(--border-focus);
}

.modal-error {
  color: var(--accent-red);
  font-size: 12px;
  margin: calc(-1 * var(--spacing-sm)) 0 var(--spacing-md);
  max-width: 420px;
}

.modal-error:empty { display: none; }

.modal-buttons {
  display: flex;
  gap: var(--spacing-md);
  justify-content: flex-end;
}

.modal-buttons .btn-primary {
  background: var(--accent-blue);
  border-color: var(--accent-blue);
  color: #fff;
}

.modal-buttons .btn-primary:hover {
  background: var(--accent-blue-hover);
}

/* === DELETE PROGRESS === */
.delete-progress {
  margin-top: var(--spacing-md);
  padding: var(--spacing-md);
  background: var(--bg-panel);
  border-radius: var(--radius-md);
  font-size: 12px;
  color: var(--text-secondary);
}

.delete-progress-bar {
  height: 4px;
  background: var(--bg-input);
  border-radius: 2px;
  margin-top: var(--spacing-sm);
  overflow: hidden;
}

.delete-progress-fill {
  height: 100%;
  background: var(--accent-red);
  transition: width 0.2s ease;
}

/* === EMPTY STATE === */
.empty-state {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: var(--spacing-md);
  opacity: 0.5;
}

.error-state { color: var(--accent-red); }

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-md);
  }
  
  .container {
    padding: var(--spacing-md);
  }
  
  .upload-area {
    padding: 30px 20px;
  }
  
  .actions { flex-direction: column; }
  
  th, td { padding: var(--spacing-sm); }
  
  .selection-toolbar {
    flex-wrap: wrap;
  }
  
  .selection-toolbar .btn {
    margin-left: 0;
    width: 100%;
    justify-content: center;
  }
}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="logo">Tally<span class="logo-accent">CCU</span> Pro</span>
      <span class="logo-sub">SD Card Manager</span>
    </div>
    <button class="btn" onclick="location.href='/'">← Back to CCU Control</button>
  </div>
    
  <div class="container">
    <div id="status" class="status"></div>
    
    <div class="control-panel">
      <div class="control-panel-header">
        <span class="control-panel-title">📤 Upload File</span>
      </div>
      <div class="control-panel-body">
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon" id="uploadIcon">📁</div>
          <p class="upload-text" id="uploadText">Drag a file here or click to select</p>
          <input type="file" id="fileInput">
        </div>
        <div class="progress-container" id="progressContainer">
          <div class="progress-filename" id="progressFilename"></div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="progress-info">
            <span id="progressBytes">0 KB / 0 KB</span>
            <span class="progress-percent" id="progressPercent">0%</span>
          </div>
          <div class="progress-status" id="progressStatus"></div>
        </div>
      </div>
    </div>
    
    <div class="control-panel">
      <div class="control-panel-header">
        <span class="control-panel-title">📂 Files on SD Card</span>
        <button class="btn btn-small" onclick="loadFiles()">↻ Refresh</button>
      </div>
      <div class="control-panel-body">
        <div class="selection-toolbar" id="selectionToolbar">
          <span class="selection-count" id="selectionCount">0 selected</span>
          <button class="btn btn-small" onclick="selectAll()">Select All</button>
          <button class="btn btn-small" onclick="deselectAll()">Deselect All</button>
          <button class="btn btn-small btn-danger" id="deleteSelectedBtn" onclick="deleteSelected()">🗑 Delete Selected</button>
        </div>
        <div id="fileList">
          <div class="loading"><span class="spinner"></span> Loading files...</div>
        </div>
        <div class="total-info" id="totalInfo"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="renameModal">
    <div class="modal-content">
      <h3>✏️ Rename File</h3>
      <input type="text" id="renameInput" placeholder="New filename" autocomplete="off" spellcheck="false">
      <p class="modal-error" id="renameError" role="alert"></p>
      <div class="modal-buttons">
        <button class="btn" onclick="closeRenameModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmRename()">Rename</button>
      </div>
    </div>
  </div>

  <div class="modal" id="deleteModal">
    <div class="modal-content">
      <h3>🗑️ Delete Files</h3>
      <p id="deleteMessage" style="color: var(--text-secondary); margin-bottom: var(--spacing-lg); white-space: pre-line;"></p>
      <div class="delete-progress" id="deleteProgress" style="display: none;">
        <span id="deleteProgressText">Deleting...</span>
        <div class="delete-progress-bar">
          <div class="delete-progress-fill" id="deleteProgressFill" style="width: 0%"></div>
        </div>
      </div>
      <div class="modal-buttons" id="deleteButtons">
        <button class="btn" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDeleteSelected()">Delete</button>
      </div>
    </div>
  </div>

  <script>
const uploadArea = document.getElementById('uploadArea');
const uploadIcon = document.getElementById('uploadIcon');
const uploadText = document.getElementById('uploadText');
const fileInput = document.getElementById('fileInput');
const progressContainer = document.getElementById('progressContainer');
const progressFilename = document.getElementById('progressFilename');
const progressBar = document.getElementById('progressBar');
const progressBytes = document.getElementById('progressBytes');
const progressPercent = document.getElementById('progressPercent');
const progressStatus = document.getElementById('progressStatus');
const statusEl = document.getElementById('status');
const renameModal = document.getElementById('renameModal');
const renameInput = document.getElementById('renameInput');
const renameError = document.getElementById('renameError');

let isUploading = false;     // from the exists check to the end of the upload
let isRenaming = false;
let isDeleting = false;
let currentRenameFile = '';
let allFiles = [];
let loadSeq = 0;
const selectedFiles = new Set();
const rows = new Map();      // selectable file name -> { row, cb }

// System pages: never deleted or renamed here. FAT ignores case, so
// "Index.html" is the same file as index.html.
const PROTECTED_FILES = ['index.html', 'tally.html', 'sdcard.html', 'safemode.html'];
const RESERVED_FILES = ['upload.tmp'];   // firmware upload temp file
// Firmware WEB_NAME_MAX (decoded bytes). Encoded, it always fits in the
// request line of download, deleteFile and fileExists; only rename,
// with two names, can overflow it.
const MAX_NAME_LEN = 47;
const MAX_REQUEST_LINE = 191;            // firmware request line buffer
// /upload body budget: 8 KB/s, capped at 60 s by the firmware
const MAX_UPLOAD_BYTES = 448 * 1024;

// Requests that change the SD card carry this header (CSRF, SEC-01)
const CSRF_HEADERS = { 'X-TallyCCU': '1' };
const FORBIDDEN_MSG = 'TallyCCU refused the request (403 forbidden). Reload the page (Ctrl+F5); ' +
  'if it keeps happening, the pages on the SD card do not match the firmware';
const SYMBOLS_MSG = 'too many spaces or symbols for the firmware';

// ===== HELPERS =====

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Name as SdFat stores it: leading spaces, trailing dots and spaces dropped
function fatName(name) {
  return name.replace(/^ +/, '').replace(/[. ]+$/, '');
}

// System pages and their .gz copies (as the firmware's isSystemFile)
function isProtected(name) {
  const base = fatName(name).toLowerCase().replace(/\.gz$/, '');
  return PROTECTED_FILES.includes(base);
}

function sameName(a, b) {
  return fatName(a).toLowerCase() === fatName(b).toLowerCase();
}

// Why a new name (upload or rename target) would be rejected or altered, or ''
function nameError(name) {
  if (!name) return 'enter a file name';
  if (fatName(name) !== name) return 'the name cannot start with a space or end with a dot or a space';
  if (/[^\x20-\x7e]/.test(name)) return 'use only plain ASCII characters (no accents or emoji)';
  if (/[<>:"\/\\|?*]/.test(name)) return 'these characters are not allowed: < > : " / \\ | ? *';
  if (name.length > MAX_NAME_LEN) return 'the name is too long (' + name.length + ' characters, max ' + MAX_NAME_LEN + ')';
  if (RESERVED_FILES.includes(name.toLowerCase())) return 'this name is reserved by the firmware';
  return '';
}

// Why a listed file cannot be addressed by the firmware (validName), or ''
function unreachable(name) {
  if (!name) return 'Unreadable name (longer than ' + MAX_NAME_LEN + ' characters?): manage this file on a PC';
  if (name.includes('?')) return 'Name with non-ASCII characters: manage this file on a PC';
  if (fatName(name) !== name || /[<>:"\/\\|*\x00-\x1f\x7f]/.test(name)) {
    return 'Name not accepted by the firmware (leading space, trailing dot/space or reserved character): ' +
      'manage this file on a PC';
  }
  return '';
}

// Firmware file manager error codes (sendFileResult)
const FILE_ERRORS = {
  'protected': 'system page name',
  'exists': 'a file with that name already exists',
  'not found': 'the file no longer exists',
  'bad name': 'name not accepted by the firmware',
  'sd': 'SD card error'
};

function fileErrorText(data, fallback) {
  const code = data && data.error;
  if (typeof code === 'string' && code) {
    return Object.prototype.hasOwnProperty.call(FILE_ERRORS, code) ? FILE_ERRORS[code] : code;
  }
  return String((data && data.message) || fallback);
}

function isSelectable(name) {
  return !isProtected(name) && !unreachable(name);
}

// fetch for requests that change something: CSRF header, clear 403 error
async function fetchAction(url, opts) {
  const res = await fetch(url, Object.assign({ cache: 'no-store' }, opts, { headers: CSRF_HEADERS }));
  if (res.status === 403) throw new Error(FORBIDDEN_MSG);
  return res;
}

// JSON body, or an Error with the start of the server's text
async function readJson(res) {
  const text = await res.text();
  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error(text.trim().slice(0, 80) || ('HTTP ' + res.status));
  }
}

// fetch() network failures are TypeErrors; ours carry the reason
function errorText(e) {
  return (e instanceof TypeError) ? 'Connection error' : e.message;
}

// ===== UPLOAD =====

uploadArea.addEventListener('click', () => {
  if (!isUploading) fileInput.click();
});

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  if (!isUploading) uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (!isUploading && e.dataTransfer.files.length > 0) {
    checkAndUpload(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener('change', () => {
  if (!isUploading && fileInput.files.length > 0) {
    checkAndUpload(fileInput.files[0]);
  }
});

function refuseUpload(name, reason) {
  fileInput.value = '';
  showStatus('Cannot upload "' + name + '": ' + reason, 'error');
}

async function checkAndUpload(file) {
  const name = file.name;
  const bad = nameError(name);
  if (bad) {
    refuseUpload(name, bad + '. Rename the file on your computer first');
    return;
  }
  if (file.size > MAX_UPLOAD_BYTES) {
    refuseUpload(name, 'file too large (' + formatSize(file.size) + ', max ' + formatSize(MAX_UPLOAD_BYTES) + ')');
    return;
  }

  isUploading = true;
  let exists = null;   // null: unknown
  try {
    const response = await fetch('/?fileExists=' + encodeURIComponent(name), { cache: 'no-store' });
    if (response.ok) exists = (await response.json()).exists === true;
  } catch (e) {
    exists = null;
  }
    
  let question = '';
  if (isProtected(name)) {
    question = '"' + name + '" is a TallyCCU system page. Replacing it changes the web interface ' +
      'for every operator, and a wrong or broken file leaves the device without this page.\n\nReplace it?';
  } else if (exists === true) {
    question = 'File "' + name + '" already exists.\n\nDo you want to overwrite it?';
  } else if (exists === null) {
    question = 'Could not check whether "' + name + '" already exists on the SD card.\n\n' +
      'Upload anyway? A file with the same name would be replaced.';
  }
  if (question && !confirm(question)) {
    isUploading = false;
    fileInput.value = '';
    return;
  }
    
  uploadFile(file);
}

function uploadFile(file) {
  isUploading = true;
  
  uploadArea.classList.add('uploading');
  uploadIcon.replaceChildren(el('span', 'spinner'));
  uploadText.textContent = 'Uploading file...';
  
  progressContainer.classList.add('show');
  progressFilename.textContent = file.name;
  progressBar.style.width = '0%';
  progressBar.className = 'progress-bar';
  progressBytes.textContent = '0 KB / ' + formatSize(file.size);
  progressPercent.textContent = '0%';
  progressStatus.textContent = '';
  progressStatus.className = 'progress-status';
  
  const formData = new FormData();
  formData.append('file', file);
  
  const xhr = new XMLHttpRequest();
  
  xhr.upload.addEventListener('progress', (e) => {
    if (e.lengthComputable) {
      const percent = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = percent + '%';
      progressPercent.textContent = percent + '%';
      progressBytes.textContent = formatSize(e.loaded) + ' / ' + formatSize(e.total);
      
      if (percent < 100) {
        progressStatus.textContent = 'Sending data...';
      } else {
        progressStatus.textContent = 'Saving to SD card...';
        progressBar.classList.add('indeterminate');
      }
    }
  });
  
  xhr.addEventListener('load', () => {
    progressBar.classList.remove('indeterminate');
    
    if (xhr.status === 403) {
      uploadError(FORBIDDEN_MSG);
    } else if (xhr.status === 200) {
      let data = null;
      try {
        data = JSON.parse(xhr.responseText);
      } catch (e) {
        data = null;
      }
      if (!data) {
        uploadError('Invalid server response');
      } else if (data.success) {
        // The firmware answers with the name it stored
        const stored = (typeof data.message === 'string' && data.message) ? data.message : file.name;
        progressBar.style.width = '100%';
        progressBar.classList.add('complete');
        progressStatus.textContent = '✓ File uploaded successfully';
        progressStatus.classList.add('success');
        showStatus('File "' + stored + '" uploaded successfully', 'success');
        loadFiles();
      } else {
        uploadError(String(data.message || 'Unknown error'));
      }
    } else {
      uploadError('HTTP error ' + xhr.status);
    }
    
    finishUpload();
  });
  
  xhr.addEventListener('error', () => {
    progressBar.classList.remove('indeterminate');
    uploadError('Connection error');
    finishUpload();
  });
  
  xhr.addEventListener('timeout', () => {
    progressBar.classList.remove('indeterminate');
    uploadError('Timeout');
    finishUpload();
  });
  
  xhr.open('POST', '/upload');
  xhr.setRequestHeader('X-TallyCCU', '1');
  xhr.timeout = 120000;
  xhr.send(formData);
}

function uploadError(message) {
  progressBar.style.width = '100%';
  progressBar.classList.add('error');
  progressStatus.textContent = '✗ Error: ' + message;
  progressStatus.classList.add('error');
  showStatus('Upload error: ' + message, 'error');
}

function finishUpload() {
  isUploading = false;
  uploadArea.classList.remove('uploading');
  uploadIcon.textContent = '📁';
  uploadText.textContent = 'Drag a file here or click to select';
  fileInput.value = '';
  
  setTimeout(() => {
    progressContainer.classList.remove('show');
  }, 3000);
}

// ===== FILE LIST =====
// Names come from the SD card: they only ever go into textContent, dataset
// and closures, never into HTML or inline handlers (SEC-05)

function setPlaceholder(container, className, icon, text) {
  const box = el('div', className);
  if (icon) box.appendChild(el('div', 'empty-state-icon', icon));
  else box.appendChild(el('span', 'spinner'));
  box.appendChild(el(icon ? 'p' : 'span', '', icon ? text : ' ' + text));
  container.replaceChildren(box);
}

function actionButton(label, title, className, onClick, disabledReason) {
  const b = el('button', 'btn btn-small' + (className ? ' ' + className : ''), label);
  b.type = 'button';
  b.title = disabledReason || title;
  b.disabled = !!disabledReason;
  b.addEventListener('click', onClick);
  return b;
}

function buildRow(file) {
  const name = file.name;
  const locked = isProtected(name);
  const blocked = unreachable(name);
  const tr = document.createElement('tr');
  tr.dataset.filename = name;

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.disabled = locked || !!blocked;
  cb.title = locked ? 'Protected system file' : blocked;
  cb.addEventListener('change', () => toggleFileSelection(name, cb.checked));
  const cbCell = el('td', 'col-checkbox');
  cbCell.appendChild(cb);

  const nameCell = el('td', 'file-name', name || '(unreadable name)');
  if (locked) nameCell.appendChild(el('span', 'file-lock', ' 🔒'));

  const size = Number(file.size) || 0;
  const sizeCell = el('td', 'file-size', formatSize(size));

  const actions = el('td', 'actions');
  actions.append(
    actionButton('⬇', 'Download', '', () => downloadFile(name), blocked),
    actionButton('✎', 'Rename', 'btn-rename', () => renameFile(name),
                 locked ? 'Protected system file' : blocked),
    actionButton('🗑', 'Delete', 'btn-danger', () => deleteFile(name),
                 locked ? 'Protected system file' : blocked));

  tr.append(cbCell, nameCell, sizeCell, actions);
  if (isSelectable(name)) rows.set(name, { row: tr, cb });
  return { tr, size };
}

async function loadFiles() {
  const seq = ++loadSeq;   // a newer refresh wins
  const fileList = document.getElementById('fileList');
  const totalInfo = document.getElementById('totalInfo');
  setPlaceholder(fileList, 'loading', '', 'Loading files...');
  selectedFiles.clear();
  rows.clear();
  updateSelectionUI();
  
  let data;
  try {
    const response = await fetch('/?listFiles&t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    data = await response.json();
  } catch (e) {
    if (seq !== loadSeq) return;
    allFiles = [];
    setPlaceholder(fileList, 'empty-state error-state', '⚠', 'Error loading files');
    totalInfo.textContent = '';
    return;
  }
  if (seq !== loadSeq) return;
  // No card or not mounted: not the same as an empty card
  if (data && data.error === 'sd') {
    allFiles = [];
    setPlaceholder(fileList, 'empty-state error-state', '⚠', 'SD card not available');
    totalInfo.textContent = '';
    return;
  }
    
  const files = (data && Array.isArray(data.files)) ? data.files : [];
  allFiles = files.filter(f => f && typeof f.name === 'string')
                  .sort((a, b) => a.name.localeCompare(b.name));
  if (allFiles.length === 0) {
    setPlaceholder(fileList, 'empty-state', '📭', 'No files on SD card');
    totalInfo.textContent = '';
    return;
  }
      
  const table = document.createElement('table');
  const head = table.createTHead().insertRow();
  const allCb = document.createElement('input');
  allCb.type = 'checkbox';
  allCb.id = 'selectAllCheckbox';
  allCb.addEventListener('change', () => toggleSelectAll(allCb.checked));
  const th0 = el('th', 'col-checkbox');
  th0.appendChild(allCb);
  head.append(th0, el('th', '', 'Name'), el('th', '', 'Size'), el('th', '', 'Actions'));
      
  const body = table.createTBody();
  let totalSize = 0;
  allFiles.forEach(file => {
    const r = buildRow(file);
    totalSize += r.size;
    body.appendChild(r.tr);
  });
  fileList.replaceChildren(table);
  updateSelectAllBox();
        
  totalInfo.textContent = allFiles.length + ' files • ' + formatSize(totalSize) + ' total';
}

// ===== SELECTION FUNCTIONS =====

function toggleFileSelection(filename, checked) {
  if (checked) {
    selectedFiles.add(filename);
  } else {
    selectedFiles.delete(filename);
  }
  const r = rows.get(filename);
  if (r) r.row.classList.toggle('selected', checked);
  updateSelectAllBox();
  updateSelectionUI();
}

function toggleSelectAll(checked) {
  if (checked) {
    selectAll();
  } else {
    deselectAll();
  }
}

function selectAll() {
  rows.forEach((r, name) => selectedFiles.add(name));
  updateAllCheckboxes();
  updateSelectionUI();
}

function deselectAll() {
  selectedFiles.clear();
  updateAllCheckboxes();
  updateSelectionUI();
}

function updateAllCheckboxes() {
  rows.forEach((r, name) => {
    const isSelected = selectedFiles.has(name);
    r.cb.checked = isSelected;
    r.row.classList.toggle('selected', isSelected);
  });
  updateSelectAllBox();
}

function updateSelectAllBox() {
  const selectAllCb = document.getElementById('selectAllCheckbox');
  if (!selectAllCb) return;
  const selectableCount = rows.size;
  selectAllCb.disabled = selectableCount === 0;
  selectAllCb.checked = selectedFiles.size === selectableCount && selectableCount > 0;
  selectAllCb.indeterminate = selectedFiles.size > 0 && selectedFiles.size < selectableCount;
}

function updateSelectionUI() {
  const toolbar = document.getElementById('selectionToolbar');
  const count = document.getElementById('selectionCount');
  const deleteBtn = document.getElementById('deleteSelectedBtn');
  
  if (selectedFiles.size > 0) {
    toolbar.classList.add('show');
    count.textContent = selectedFiles.size + ' selected';
    deleteBtn.disabled = false;
  } else {
    toolbar.classList.remove('show');
    deleteBtn.disabled = true;
  }
}

// ===== DELETE FUNCTIONS =====

// Resolves when deleted; rejects with the reason
async function requestDelete(filename) {
  const response = await fetchAction('/?deleteFile=' + encodeURIComponent(filename));
  const data = await readJson(response);
  if (data.success === true) return;
  if (data.error === 'protected') throw new Error('protected system file');
  throw new Error(fileErrorText(data, 'not deleted (file missing or SD error)'));
}

function deleteSelected() {
  if (selectedFiles.size === 0 || isDeleting) return;
  
  const fileList = Array.from(selectedFiles);
  document.getElementById('deleteMessage').textContent = 
    'Are you sure you want to delete ' + fileList.length + ' file' + (fileList.length > 1 ? 's' : '') + '?\n\nThis action cannot be undone.';
  document.getElementById('deleteProgress').style.display = 'none';
  document.getElementById('deleteButtons').style.display = 'flex';
  document.getElementById('confirmDeleteBtn').disabled = false;
  document.getElementById('deleteModal').classList.add('show');
}

function closeDeleteModal() {
  if (!isDeleting) {
    document.getElementById('deleteModal').classList.remove('show');
  }
}

async function confirmDeleteSelected() {
  if (isDeleting) return;
  
  const fileList = Array.from(selectedFiles).filter(isSelectable);
  if (fileList.length === 0) return;
  
  isDeleting = true;
  document.getElementById('confirmDeleteBtn').disabled = true;
  document.getElementById('deleteProgress').style.display = 'block';
  
  let deleted = 0;
  let errors = 0;
  let firstError = '';
  
  for (let i = 0; i < fileList.length; i++) {
    const filename = fileList[i];
    document.getElementById('deleteProgressText').textContent = 
      'Deleting ' + (i + 1) + ' of ' + fileList.length + ': ' + filename;
    document.getElementById('deleteProgressFill').style.width = 
      Math.round(((i + 1) / fileList.length) * 100) + '%';
    
    try {
      await requestDelete(filename);
      deleted++;
      selectedFiles.delete(filename);
    } catch (e) {
      errors++;
      if (!firstError) firstError = filename + ': ' + errorText(e);
      // Refused or unreachable: the rest would fail the same way
      if (e.message === FORBIDDEN_MSG || e instanceof TypeError) {
        errors += fileList.length - i - 1;
        break;
      }
    }
    
    // Small delay between deletions to not overwhelm the Arduino
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  
  isDeleting = false;
  document.getElementById('deleteModal').classList.remove('show');
  
  if (errors === 0) {
    showStatus(deleted + ' file' + (deleted > 1 ? 's' : '') + ' deleted successfully', 'success');
  } else {
    showStatus(deleted + ' deleted, ' + errors + ' failed. ' + firstError, 'error');
  }
  
  loadFiles();
}

async function deleteFile(filename) {
  if (isProtected(filename)) {
    showStatus('Cannot delete protected system file', 'error');
    return;
  }
  const blocked = unreachable(filename);
  if (blocked) {
    showStatus(blocked, 'error');
    return;
  }
  
  if (!confirm('Delete "' + filename + '"?\n\nThis action cannot be undone.')) {
    return;
  }
  
  try {
    await requestDelete(filename);
    showStatus('File "' + filename + '" deleted', 'success');
    loadFiles();
  } catch (e) {
    showStatus('Error deleting "' + filename + '": ' + errorText(e), 'error');
  }
}

function downloadFile(filename) {
  const blocked = unreachable(filename);
  if (blocked) {
    showStatus(blocked, 'error');
    return;
  }
  window.location.href = '/?download=' + encodeURIComponent(filename);
}

// ===== RENAME =====

function renameFile(filename) {
  if (isProtected(filename)) {
    showStatus('Cannot rename protected system file', 'error');
    return;
  }
  const blocked = unreachable(filename);
  if (blocked) {
    showStatus(blocked, 'error');
    return;
  }
  currentRenameFile = filename;
  renameInput.value = filename;
  renameError.textContent = '';
  renameModal.classList.add('show');
  renameInput.focus();
  renameInput.select();
}

function closeRenameModal() {
  if (isRenaming) return;
  renameModal.classList.remove('show');
  currentRenameFile = '';
}

// Why the rename target is not acceptable, or ''
function renameTargetError(oldName, newName) {
  const bad = nameError(newName);
  if (bad) return bad;
  if (isProtected(newName)) return '"' + newName + '" is a system page name';
  if (sameName(oldName, newName)) return 'the SD card ignores upper/lower case: use a different name';
  if (allFiles.some(f => sameName(f.name, newName))) return 'a file named "' + newName + '" already exists';
  const url = '/?renameFile=' + encodeURIComponent(oldName) + '&to=' + encodeURIComponent(newName);
  if (('GET ' + url + ' HTTP/1.1').length > MAX_REQUEST_LINE) return 'the names have ' + SYMBOLS_MSG;
  return '';
}

async function confirmRename() {
  if (isRenaming || !currentRenameFile) return;
  const oldName = currentRenameFile;
  const newName = renameInput.value.trim();
  
  if (newName === oldName) {
    closeRenameModal();
    return;
  }
  const bad = renameTargetError(oldName, newName);
  if (bad) {
    renameError.textContent = 'Cannot rename: ' + bad;
    return;
  }
  
  isRenaming = true;
  try {
    const url = '/?renameFile=' + encodeURIComponent(oldName) + '&to=' + encodeURIComponent(newName);
    const data = await readJson(await fetchAction(url));
  
    if (data.success === true) {
      showStatus('File renamed to "' + newName + '"', 'success');
      loadFiles();
    } else {
      showStatus('Error renaming "' + oldName + '": ' +
                 fileErrorText(data, 'name already exists or SD error'), 'error');
    }
  } catch (e) {
    showStatus('Error renaming "' + oldName + '": ' + errorText(e), 'error');
  }
  isRenaming = false;
  
  closeRenameModal();
}

renameInput.addEventListener('input', () => {
  renameError.textContent = '';
});

// ===== MISC =====

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

let statusTimer = null;
function showStatus(message, type) {
  statusEl.textContent = message;
  statusEl.className = 'status ' + type;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.className = 'status'; }, type === 'error' ? 8000 : 5000);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeRenameModal();
    closeDeleteModal();
  }
  if (e.key === 'Enter' && renameModal.classList.contains('show')) {
    e.preventDefault();   // no second confirmRename() from a focused button
    confirmRename();
  }
});

loadFiles();
  </script>
